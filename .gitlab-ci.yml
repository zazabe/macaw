stages:
  - main

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: none

fmt:
  stage: main
  interruptible: true
  image: docker.io/library/rust:1.97.1
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all -- --check


clippy:
  stage: main
  interruptible: true
  image: docker.io/library/rust:1.97.1
  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

test:
  stage: main
  interruptible: true
  image: docker.io/library/rust:1.97.1
  script:
    - cargo test --workspace --all-targets --all-features

wasi-python:
  stage: main
  interruptible: true
  image: docker.io/library/rust:1.97.1
  before_script:
    - apt-get update
    - apt-get install --yes make python3 python3-venv
  script:
    - make -C examples/wasm/python build
    - MACAW_WASM_COMPONENT="$CI_PROJECT_DIR/examples/wasm/python/target/http-auth-plugin-python.wasm" cargo test --release -p macaw-wasm --test recorder
