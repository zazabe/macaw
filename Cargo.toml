[workspace]
members = [ "macaw-core", "macaw-http", "macaw-ws" ]

[workspace.package]
version = "0.1.0"
authors = [ "Michel Meyer <michel@zazabe.fr>", "Reto Kaiser" ]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = [ "derive" ] }
colored = "2"
terminal_size = "0.3"
arrayvec = { version = "0.7", features = [ "serde" ] }
async-trait = "0.1.85"
async-stream = "0.3.5"
base64 = "0.22"
bytes = { version = "1.11", features = [ "serde" ] }
chrono = { version = "0.4", features = [ "serde" ] }
fs-err = "3.2.2"
dyn-clone = "1.0.17"
dyn-clonable = "0.9.0"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.8", features = [ "full" ] }
hyper-rustls = { version = "0.27", features = [ "http1", "http2", "rustls-platform-verifier" ] }
hyper-util = { version = "0.1", features = [ "full" ] }
itertools = "0.14"
pin-project-lite = "0.2"
rustls = "0.23"
rustls-platform-verifier = "0.6"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_regex = "1"
serde_yaml = "0.9"
toml = "0.9"
tokio = { version = "1", features = [ "full", "tracing" ] }
tokio-tungstenite = { version = "0.28", features = [ "url", "rustls-tls-native-roots" ] }
tokio-stream = { version = "0.1", features = [ "full" ] }
tracing = "0.1"
typetag = "0.2.21"
url = "2.5.2"
uuid = { version = "1.13", features = [ "v4", "serde" ] }
take_mut = "0.2"
thiserror = "2"
ahash = "0.8"
once_cell = "1.21"

# For tests
assert_matches = "1.5"
tempfile = "3"
insta = { version = "1", features = [ "json", "redactions" ] }
httpmock = "0.8"
reqwest = { version = "0.12", features = [ "json" ] }
regex = "1"
flate2 = "1"

[workspace.lints.rust]

[workspace.lints.clippy]

[package]
name = "macaw"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "macaw"
path = "lib/lib.rs"

[[example]]
name = "recorder"
path = "examples/recorder.rs"

[[example]]
name = "replayer"
path = "examples/replayer.rs"

[[bin]]
name = "macaw"
path = "src/main.rs"

[dependencies]
macaw-core = { path = "macaw-core" }
macaw-http = { path = "macaw-http" }
macaw-ws = { path = "macaw-ws" }
anyhow = "*"
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
colored = { workspace = true }
terminal_size = { workspace = true }
futures.workspace = true
tracing.workspace = true
tokio.workspace = true
tracing-subscriber = { version = "*", features = [ "env-filter" ] }
console-subscriber = "0.5"
tokio-stream = { version = "*", features = [ "full" ] }
signal = "0.7"
bytesize = "2"
