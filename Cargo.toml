[workspace]
members = [ "macaw-core", "macaw-http", "macaw-ws", "macaw-wasm" ]

[workspace.package]
version = "0.2.0"
authors = [ "Michel Meyer <michel@zazabe.fr>", "Reto Kaiser" ]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = [ "derive" ] }
colored = "3"
terminal_size = "0.4"
arrayvec = { version = "0.7", features = [ "serde" ] }
async-trait = "0.1.91"
async-stream = "0.3.6"
base64 = "0.23"
bytes = { version = "1.12", features = [ "serde" ] }
chrono = { version = "0.4", features = [ "serde" ] }
fs-err = "3.3.1"
dyn-clone = "1.0.20"
dyn-clonable = "0.9.2"
futures = "0.3"
http = "1"
http-body-util = "0.1"
tower-service = "0.3"
hyper = { version = "1.11", features = [ "full" ] }
hyper-rustls = { version = "0.27", features = [ "http1", "http2", "rustls-platform-verifier" ] }
hyper-util = { version = "0.1", features = [ "full" ] }
itertools = "0.15"
pin-project-lite = "0.2"
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_regex = "1"
serde_yaml = "0.9"
toml = "1.1"
tokio = { version = "1", features = [ "full", "tracing" ] }
tokio-tungstenite = { version = "0.30", features = [ "url", "rustls-tls-native-roots" ] }
tokio-stream = { version = "0.1", features = [ "full" ] }
tracing = "0.1"
typetag = "0.2.23"
url = "2.5.8"
uuid = { version = "1.24", features = [ "v4", "serde" ] }
take_mut = "0.2"
ahash = "0.8"
once_cell = "1.21"
wasmtime = { version = "47.0.3", default-features = false, features = [ "std", "runtime", "component-model", "cranelift" ] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = [ "p2" ] }
wat = "1"

# For tests
assert_matches = "1.5"
tempfile = "3"
insta = { version = "1", features = [ "json", "redactions" ] }
httpmock = "0.8"
reqwest = { version = "0.13", features = [ "json" ] }
regex = "1"
flate2 = "1"
tokio-rustls = "0.26"
rcgen = "0.14"

[workspace.lints.rust]

[workspace.lints.clippy]

[package]
name = "macaw"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }

[features]
default = [ "http", "ws" ]
http = [ "dep:macaw-http" ]
ws = [ "dep:macaw-ws" ]
wasm = [ "http", "dep:macaw-wasm" ]

[lib]
name = "macaw"
path = "lib/lib.rs"

[[example]]
name = "recorder"
path = "examples/recorder.rs"
required-features = [ "http", "ws" ]

[[example]]
name = "replayer"
path = "examples/replayer.rs"
required-features = [ "http", "ws" ]

[[example]]
name = "wasm"
path = "examples/wasm/host.rs"
required-features = [ "wasm" ]

[[bin]]
name = "macaw"
path = "src/main.rs"

[dependencies]
macaw-core = { path = "macaw-core" }
macaw-http = { path = "macaw-http", optional = true }
macaw-ws = { path = "macaw-ws", optional = true }
macaw-wasm = { path = "macaw-wasm", optional = true }
anyhow = "*"
thiserror = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
colored = { workspace = true }
terminal_size = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { version = "*", features = [ "env-filter" ] }
console-subscriber = "0.5"
tokio-stream = { version = "*", features = [ "full" ] }
signal = "0.7"
bytesize = "2"

[dev-dependencies]
tempfile = { workspace = true }
