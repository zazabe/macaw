[package]
name = "macaw"
version = "0.1.0"
authors = [ "Michel Meyer <michel@zazabe.fr>", "Reto" ]
edition = "2024"

[lib]
name = "macaw"
path = "lib/lib.rs"

[[bin]]
name = "macaw"
path = "src/main.rs"

[[example]]
name = "http_proxy"
path = "examples/http_proxy.rs"

[[example]]
name = "ws_proxy"
path = "examples/ws_proxy.rs"

[dependencies]
rustls = "0.23"
rustls-platform-verifier = "0.6"
tokio = { version = "1", features = [ "full" ] }
bytes = "1.2"
http = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
structopt = "0.3"
anyhow = "1"
hyper = { version = "1", features = [ "full" ] }
hyper-util = { version = "0.1", features = [ "full" ] }
hyper-rustls = { version = "0.27", features = [ "http1", "http2", "rustls-platform-verifier" ] }
log = "0.4"
env_logger = "0.11"
tracing = "*"
tracing-subscriber = { version = "^0.3.16", features = [ "env-filter" ] }
async-stream = "0.3.5"
tokio-tungstenite = { version = "0.28", features = [ "url", "rustls-tls-native-roots" ] }
futures = "0.3"
url = "2.5.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1.13", features = [ "v4", "serde" ] }
chrono = { version = "0.4", features = [ "serde" ] }
dyn-clone = "1.0.17"
dyn-clonable = "0.9.0"
async-trait = "0.1.85"
itertools = "0.14"
base64 = "0.21"
